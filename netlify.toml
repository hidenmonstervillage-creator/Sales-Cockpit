[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned to the major version this was built and tested against locally
  # (node v24.15.0). Netlify's default image version drifts over time — without
  # this, a build can pass here and fail there.
  NODE_VERSION = "24"
  # Netlify runs `npm ci` when package-lock.json is present; keep it that way so
  # the deploy resolves the exact versions in the lockfile.
  NPM_FLAGS = "--no-audit --no-fund"

# Static single-page app: no backend, no environment variables, no functions.
# Real lead contact data lives in the browser's localStorage — keep it out of
# search engines and out of other sites' frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
